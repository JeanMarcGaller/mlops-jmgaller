[project]
name = "mlops-temperature-forecasting"
version = "0.1.0"
description = "MLOps temperature forecasting pipeline using Open-Meteo and Hopsworks"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "hopsworks[python]==4.7.2",
    "joblib>=1.5.3",
    "numpy>=2.4.4",
    "optuna>=4.8.0",
    "pandas<2.4.0",
    "pyarrow>=24.0.0",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
    "scikit-learn>=1.8.0",
    "streamlit>=1.57.0",
    "xgboost>=3.2.0",
]

[dependency-groups]
dev = [
    "pandas-stubs~=2.3.3",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]


[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "pragma: no cover",
]